name: Keep LeadGen API Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LeadGen API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 https://apis-4g3r.onrender.com/ping)
          echo "Ping status: $STATUS at $(date)"
          if [ "$STATUS" != "200" ]; then
            echo "API returned non-200, waiting 90s for cold start..."
            sleep 90
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 https://apis-4g3r.onrender.com/ping)
            echo "Retry status: $STATUS2 at $(date)"
          fi
