name: Keep LeadGen Alive

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping LeadGen API
        run: |
          curl -s -o /dev/null --connect-timeout 30 --max-time 60 https://apis-4g3r.onrender.com/ping || true
          echo "API pinged at $(date)"
        shell: bash
